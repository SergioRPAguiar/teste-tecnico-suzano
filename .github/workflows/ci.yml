name: Verificação do case
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://suzano:suzano_local_dev@localhost:5432/suzano_case_test?schema=public
      JWT_SECRET: chave-exclusiva-de-testes-com-mais-de-32-caracteres
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Suzano@123
    services:
      postgres:
        image: postgres:17-alpine@sha256:dfb95bc50724a7398ee250d72a4318cd51ccf844c5956595722520d449408176
        env:
          POSTGRES_DB: suzano_case_test
          POSTGRES_USER: suzano
          POSTGRES_PASSWORD: suzano_local_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U suzano -d suzano_case_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_PUBLIC_API_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
